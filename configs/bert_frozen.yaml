run_name: bert_frozen
seed: 42

n_splits: 5
folds: [0]

text_column: comment_text
label_columns: ['toxic', 'severe_toxic', 'obscene', 'threat', 'insult', 'identity_hate']

train_csv_path: data/train.csv
test_csv_path: data/test.csv

model:
  name: bert-base-uncased
  max_len: 512
  freeze_encoder: true
train:
  batch_size: 32
  epochs: 2
  lr: 1.0e-3
  pos_weight: true
